<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaNear - أقرب صيدلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; font-size: 24px; }
        p { color: #7f8c8d; }
        .btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background-color: #219150; }
        #loading { display: none; margin-top: 15px; color: #e67e22; font-weight: bold; }
        .pharmacy-card {
            background: #eef9f1;
            border-right: 5px solid #27ae60;
            margin: 15px 0;
            padding: 15px;
            text-align: right;
            border-radius: 5px;
        }
        .pharmacy-card h3 { margin: 0 0 5px 0; color: #2c3e50; }
        .pharmacy-card p { margin: 3px 0; color: #34495e; font-size: 14px; }
        .status { font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 تطبيق PharmaNear</h1>
    <p>البحث الآلي عن أقرب الصيدليات المعتمدة عبر الـ GPS</p>
    
    <button class="btn" onclick="getLocations()">📍 تحديد موقعي والأقرب فوراً</button>
    
    <div id="loading">⏳ جاري التقاط الـ GPS وجلب أقرب الصيدليات...</div>
    <div id="results"></div>
</div>

<script>
function getLocations() {
    const loading = document.getElementById('loading');
    const resultsDiv = document.getElementById('results');
    
    loading.style.display = 'block';
    resultsDiv.innerHTML = '';

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                fetch(`/api/pharmacies/nearest?lat=${lat}&lon=${lon}`)
                .then(response => response.json())
                .then(data => {
                    loading.style.display = 'none';
                    if (data.status === 'success' && data.count > 0) {
                        data.data.forEach(p => {
                            resultsDiv.innerHTML += `
                                <div class="pharmacy-card">
                                    <h3>${p.name}</h3>
                                    <p>📍 <b>العنوان:</b> ${p.address}</p>
                                    <p>📏 <b>المسافة:</b> ${p.distance} كم</p>
                                    <p>📞 <b>الهاتف:</b> ${p.phone}</p>
                                    <p class="status">🕒 ${p.open_state}</p>
                                </div>
                            `;
                        });
                    } else {
                        resultsDiv.innerHTML = '<p style="color:red;">لم يتم العثور على صيدليات قريبة حالياً.</p>';
                    }
                })
                .catch(error => {
                    loading.style.display = 'none';
                    resultsDiv.innerHTML = '<p style="color:red;">حدث خطأ أثناء الاتصال بالسيرفر.</p>';
                });
            },
            (error) => {
                loading.style.display = 'none';
                alert('عذراً، يجب سماح الوصول للـ GPS لتحديد موقعك.');
            }
        );
    } else {
        loading.style.display = 'none';
        alert('ميزّة الـ GPS غير مدعومة في متصفحك.');
    }
}
</script>

</body>
</html>

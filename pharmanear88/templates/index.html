<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaNear - بوابة الصيدليات الذكية</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .hero-card { background: #1e293b; border-radius: 16px; padding: 2rem; border: 1px solid #334155; }
        .btn-custom { background-color: #10b981; color: white; font-weight: bold; border-radius: 8px; padding: 12px 24px; }
        .btn-custom:hover { background-color: #059669; color: white; }
        .pharmacy-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; margin-bottom: 1rem; padding: 1.5rem; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="hero-card text-center mb-5">
            <h1 class="fw-bold mb-3">بوابتك الذكية للوصول إلى الدواء</h1>
            <p class="text-muted mb-4">حدد موقعك الجغرافي للبحث عن أقرب الصيدليات والتواصل معها مباشرة</p>
            <button id="locateBtn" class="btn btn-custom btn-lg" onclick="getLocation()">
                تحديد موقعي وإيجاد أقرب صيدلية 📍
            </button>
            <div id="status" class="mt-3 text-warning"></div>
        </div>

        <div id="resultsContainer" class="row"></div>
    </div>

    <script>
        function getLocation() {
            const status = document.getElementById('status');
            const locateBtn = document.getElementById('locateBtn');

            if (!navigator.geolocation) {
                status.innerText = "الجي بي إس غير مدعوم في متصفحك";
                return;
            }

            status.innerText = "جاري تحديد موقعك الجغرافي...";
            locateBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    status.innerText = "تم تحديد الموقع! جاري البحث عن الصيدليات...";
                    fetchPharmacies(lat, lon);
                },
                (error) => {
                    status.innerText = "تعذر الحصول على الموقع. يرجى تفعيل الـ GPS والتأكد من إعطاء الإذن.";
                    locateBtn.disabled = false;
                },
                { enableHighAccuracy: true }
            );
        }

        function fetchPharmacies(lat, lon) {
            fetch(`/api/pharmacies/nearest?lat=${lat}&lon=${lon}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('locateBtn').disabled = false;
                    document.getElementById('status').innerText = "";
                    renderPharmacies(data.data);
                })
                .catch(err => {
                    document.getElementById('status').innerText = "حدث خطأ أثناء جلب البيانات.";
                    document.getElementById('locateBtn').disabled = false;
                });
        }

        function renderPharmacies(pharmacies) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = "";

            if (!pharmacies || pharmacies.length === 0) {
                container.innerHTML = `<div class="text-center text-muted">لم يتم العثور على صيدليات قريبة في نطاق 3 كم.</div>`;
                return;
            }

            pharmacies.forEach(p => {
                const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
                
                let phoneButtons = "";
                if (p.phone) {
                    phoneButtons = `
                        <a href="tel:${p.phone}" class="btn btn-outline-success btn-sm me-2">اتصال 📞</a>
                        <a href="https://wa.me/${p.phone.replace(/[^0-9]/g, '')}" target="_blank" class="btn btn-outline-light btn-sm me-2">واتساب 💬</a>
                    `;
                } else {
                    phoneButtons = `<span class="badge bg-secondary me-2">الرقم غير مسجل</span>`;
                }

                const cardHTML = `
                    <div class="col-md-6">
                        <div class="pharmacy-card">
                            <h4 class="fw-bold text-success">${p.name}</h4>
                            <p class="text-muted small mb-3">الإحداثيات: ${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</p>
                            <div class="d-flex align-items-center flex-wrap gap-2">
                                <a href="${mapUrl}" target="_blank" class="btn btn-primary btn-sm">الذهاب للصيدلية 🗺️</a>
                                ${phoneButtons}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }
    </script>
</body>
</html>

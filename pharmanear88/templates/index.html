<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaNear - تحديد تلقائي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b132b; color: #fff; font-family: system-ui, sans-serif; }
        .box { background: #1c2541; border-radius: 15px; padding: 20px; border: 1px solid #3a506b; }
        .card-pharm { background: #1c2541; border: 1px solid #48cae4; border-radius: 12px; margin-bottom: 12px; padding: 15px; }
        .btn-find { background: #00b4d8; color: #fff; font-weight: bold; width: 100%; border-radius: 10px; padding: 12px; }
    </style>
</head>
<body class="p-3">

    <div class="container" style="max-width: 600px;">
        <div class="box text-center mb-4">
            <h3 class="text-info fw-bold">PharmaNear 💊</h3>
            <p class="text-secondary small">التحديد التلقائي للموقع والأقرب لك</p>
            
            <button id="btnFind" class="btn btn-find mb-2" onclick="getLocationAndSearch()">تحديد موقعي والبحث تلقائياً 🔍</button>
            <div id="log" class="text-warning small mt-2"></div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        function getLocationAndSearch() {
            const log = document.getElementById('log');
            const res = document.getElementById('results');
            const btn = document.getElementById('btnFind');

            if (!navigator.geolocation) {
                log.innerText = "❌ الـ GPS غير مدعوم في متصفحك.";
                return;
            }

            log.innerText = "📡 جاري طلب الموقع بأعلى دقة ممكنة...";
            btn.disabled = true;

            // إعدادات إجبار المتصفح على استخدام أقوى دقة (GPS حقيقي)
            const options = {
                enableHighAccuracy: true, // أجبر الجهاز يستعمل الـ GPS الحقيقي مش الـ IP
                timeout: 15000,           // أمهله 15 ثانية لجلب النقطة
                maximumAge: 0             // لا تستخدم موقع قديما مخزن
            };

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    log.innerText = `تم تحديد موقعك بدقة! جاري جلب الصيدليات...`;
                    
                    fetchPharmacies(lat, lon);
                },
                (err) => {
                    btn.disabled = false;
                    if(err.code === err.TIMEOUT) {
                        log.innerText = "⚠️ تأخر الـ GPS في الاستجابة. جرب مرة أخرى أو تأكد من إعطاء الصلاحية للمتصفح.";
                    } else {
                        log.innerText = "❌ تعذر التحديد التلقائي. يرجى تفعيل الموقع (Location) في الويندوز/المتصفح.";
                    }
                },
                options
            );
        }

        function fetchPharmacies(lat, lon) {
            const log = document.getElementById('log');
            const res = document.getElementById('results');

            fetch(`/api/pharmacies/nearest?lat=${lat}&lon=${lon}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('btnFind').disabled = false;
                    if (d.status === "success" && d.data.length > 0) {
                        log.innerText = `تم العثور على ${d.count} صيدلية حول موقعك!`;
                        res.innerHTML = "";
                        d.data.forEach(p => {
                            const mapLink = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
                            res.innerHTML += `
                                <div class="card-pharm">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <h5 class="m-0 text-white">${p.name}</h5>
                                        <span class="badge bg-success">${p.distance} كم</span>
                                    </div>
                                    <p class="text-secondary small mt-1 mb-2">📍 ${p.address}</p>
                                    <p class="text-info small mb-2">📞 ${p.phone}</p>
                                    <a href="${mapLink}" target="_blank" class="btn btn-outline-info btn-sm w-100">الاتجاهات على جوجل ماب 🗺️</a>
                                </div>
                            `;
                        });
                    } else {
                        log.innerText = "⚠️ لم يتم العثور على صيدليات مسجلة في نطاق منطقتك حالياً.";
                    }
                })
                .catch(err => {
                    document.getElementById('btnFind').disabled = false;
                    log.innerText = "❌ خطأ: افتح الرابط http://127.0.0.1:5000 وليس الملف المباشر.";
                });
        }
    </script>
</body>
</html>
